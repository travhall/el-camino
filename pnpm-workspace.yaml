  uuid: "^14.0.0"
  form-data: ">=4.0.6"
  undici: ">=8.10.2 <8.11.0"
  typescript: "6.0.3"
  tar: ">=7.5.21"
  fast-uri: ">=4.2.3"
  nanoid: ">=3.3.18"
  postcss: ">=8.5.23"
  sharp: ">=0.35.0"
  "@iconify/tools>svgo": ">=3.3.5 <4.0.0"
  "astro>svgo": ">=4.1.0"
  "ipx>svgo": ">=4.1.0"
  "minimatch@5.1.9>brace-expansion": ">=2.1.4 <3.0.0"
  "minimatch@9.0.9>brace-expansion": ">=2.1.4 <3.0.0"
  "minimatch@10.2.5>brace-expansion": ">=5.0.12"
  # Advisory closures — see plans 164 and 215. All are transitive, mostly
  # build-time, via astro, @astrojs/netlify (its bundler and dev tooling),
  # @netlify/blobs and @astrojs/check. A floor here only moves a package when
  # the lockfile is re-resolved, so raise the floor when a new advisory lands.
  #
  # Deliberately NOT overridden (re-check when the parents release):
  #   extract-zip   no fixed version published (via astro-icon > @iconify/tools)
  #   undici        held at 8.10.x. 8.12 fixes the remaining advisories but
  #                 needs zlib zstd support (Node >=22.15 or >=23.8) just to
  #                 load. Netlify and CI are on Node 22 and would be fine; a
  #                 developer machine on Node 23.5 is not. Raise to >=8.12.2
  #                 and set engines.node to >=22.19 together.
  #   glob, minimatch   fixes are major bumps (14, 11) of build-time tooling
  #                 inside @netlify/zip-it-and-ship-it; forcing a major there
  #                 risks the function bundler for a moderate, build-only issue
  toml: ">=5.0.1"
  "@opentelemetry/core": ">=2.8.0"
  yaml: ">=2.8.3"
  "@fastify/busboy": ">=3.2.2"
  smol-toml: ">=1.9.0"
  source-map-js: ">=1.2.2"
  zod: ">=4.6.6"
  # Not advisories: keep the wasm runtime pair on the same stable line. A fresh
  # resolve otherwise auto-installs @emnapi/runtime 2.0 beta as a peer next to
  # @emnapi/core 1.x and `astro check` dies with "this.bridge.setLastError is
  # not a function". The two are also listed in devDependencies for that
  # reason: peers resolve to a version the root already has.
  "@emnapi/runtime": ">=1.11.3 <2.0.0"
  "@emnapi/core": ">=1.11.3 <2.0.0"

onlyBuiltDependencies:
  - esbuild
  - sharp
